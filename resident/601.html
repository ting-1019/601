<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>601</title>
<style>
/* ==========================================================
   全局
   ========================================================== */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: #0D0D0D;
  font-family: "Songti SC", "SimSun", "STSong", "Songti TC",
               "Noto Serif SC", "Source Han Serif SC", serif;
  font-size: 16px;
  line-height: 2;
  color: #C8C8C8;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  animation: roomBreathe 9s ease-in-out infinite;
}
@keyframes roomBreathe {
  0%, 100% { background: #0D0D0D; }
  50%      { background: #0F0F0F; }
}

a { color: #C8C8C8; text-decoration: none; }

::selection { background: #C8C8C8; color: #0D0D0D; }
::-moz-selection { background: #C8C8C8; color: #0D0D0D; }

/* ==========================================================
   假加载
   ========================================================== */
#boot {
  position: fixed; inset: 0;
  background: #0D0D0D;
  z-index: 9999;
  transition: opacity 1s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

/* ==========================================================
   噪点
   ========================================================== */
.noise {
  position: fixed; inset: 0;
  z-index: 9000;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  mix-blend-mode: screen;
}

/* ==========================================================
   闪烁层
   ========================================================== */
.flash {
  position: fixed;
  inset: 0;
  z-index: 9500;
  pointer-events: none;
  background: #FFFFFF;
  opacity: 0;
}
.flash.on { animation: flashPulse 0.5s ease-out; }
@keyframes flashPulse {
  0%   { opacity: 0; }
  8%   { opacity: 0.75; }
  20%  { opacity: 0.05; }
  35%  { opacity: 0.55; }
  55%  { opacity: 0.02; }
  75%  { opacity: 0.28; }
  100% { opacity: 0; }
}

/* ==========================================================
   主布局
   ========================================================== */
.wrap {
  opacity: 0;
  transition: opacity 1.4s ease;
  min-height: 100vh;
  padding: 90px 30px 120px;
  display: flex;
  justify-content: center;
}
.wrap.loaded { opacity: 1; }

.scene {
  width: 100%;
  max-width: 620px;
}

/* ==========================================================
   标题
   ========================================================== */
.scene-title {
  margin: 0 0 52px;
  padding-bottom: 18px;
  font-size: 15px;
  font-weight: normal;
  letter-spacing: 0.28em;
  color: #7A7A7A;
  border-bottom: 1px solid rgba(200, 200, 200, 0.06);
}

/* ==========================================================
   叙述区
   ========================================================== */
.narrative {
  min-height: 340px;
  margin-bottom: 56px;
}

.nar-text {
  margin: 0;
  font-size: 17px;
  line-height: 2.25;
  letter-spacing: 0.05em;
  color: #C8C8C8;
  white-space: pre-line;
  word-break: break-word;
  opacity: 1;
  transition: opacity 0.45s ease;
}
.nar-text.fade { opacity: 0; }

.nar-text.final {
  color: #E6E6E6;
  text-shadow: 0 0 16px rgba(200, 200, 200, 0.16);
}
.nar-text.warn {
  color: #D4B0A0;
  letter-spacing: 0.08em;
}

/* ==========================================================
   密码锁面板
   ========================================================== */
.lock-panel {
  margin: 20px 0 0;
  padding: 22px 26px 24px;
  border: 1px solid rgba(200, 200, 200, 0.1);
  background: rgba(255, 255, 255, 0.012);
  animation: panelIn 0.55s ease both;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.lock-panel .lp-title {
  margin: 0 0 16px;
  font-size: 15px;
  letter-spacing: 0.14em;
  color: #C8C8C8;
}

.lock-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.lock-input {
  width: 160px;
  padding: 8px 12px;
  background: transparent;
  border: 1px solid rgba(200, 200, 200, 0.28);
  color: #E6E6E6;
  font-family: "Courier New", monospace;
  font-size: 17px;
  letter-spacing: 0.42em;
  text-align: center;
  outline: none;
  caret-color: #E6E6E6;
  transition: border-color 0.22s ease, box-shadow 0.22s ease;
}
.lock-input:focus {
  border-color: rgba(230, 230, 230, 0.75);
  box-shadow: 0 0 12px rgba(200, 200, 200, 0.16);
}

.lock-btn {
  padding: 8px 22px;
  background: transparent;
  border: 1px solid rgba(200, 200, 200, 0.32);
  color: #C8C8C8;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 15px;
  letter-spacing: 0.18em;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease,
              border-color 0.2s ease;
}
.lock-btn:hover {
  background: rgba(200, 200, 200, 0.9);
  color: #0D0D0D;
  border-color: #C8C8C8;
}
.lock-btn:active { background: rgba(200, 200, 200, 0.65); }

.lock-hint {
  margin: 6px 0 0;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #7A7A7A;
  line-height: 1.9;
}
.lock-hint .em { color: #A8A8A8; }

.lock-error {
  margin: 14px 0 0;
  font-size: 13.5px;
  letter-spacing: 0.06em;
  color: #8A7A70;
  line-height: 1.9;
  opacity: 0;
  transition: opacity 0.4s ease;
  white-space: pre-line;
}
.lock-error.on { opacity: 1; }

/* ==========================================================
   热区
   ========================================================== */
.hotspot-area {
  padding-top: 36px;
  border-top: 1px solid rgba(200, 200, 200, 0.05);
}

.hs-label {
  margin: 0 0 20px;
  font-size: 14px;
  letter-spacing: 0.14em;
  color: #6A6A6A;
}

.hs-row {
  display: flex;
  flex-wrap: wrap;
  gap: 28px 30px;
}

.hotspot {
  display: inline-block;
  font-size: 16px;
  letter-spacing: 0.1em;
  color: #C8C8C8;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: color 0.25s ease, text-shadow 0.25s ease,
              transform 0.12s ease;
}
.hotspot:hover {
  color: #FFFFFF;
  text-shadow: 0 0 10px rgba(220, 220, 220, 0.55);
}
.hotspot:active {
  transform: scale(0.96);
  color: #A8A8A8;
  text-shadow: none;
}
.hotspot.seen { color: #9A9A9A; }
.hotspot.seen:hover { color: #E0E0E0; }

/* ==========================================================
   隐藏热区：地板
   ========================================================== */
.floor-zone {
  margin-top: 70px;
  text-align: center;
}

.floor-hotspot {
  display: inline-block;
  font-size: 14px;
  letter-spacing: 0.22em;
  color: #0D0D0D;
  user-select: text;
  -webkit-user-select: text;
  cursor: pointer;
  padding: 4px 14px;
  transition: color 0.3s ease;
}
.floor-hotspot::selection {
  background: #C8C8C8;
  color: #0D0D0D;
}
.floor-hotspot::-moz-selection {
  background: #C8C8C8;
  color: #0D0D0D;
}

/* ==========================================================
   底部提示 + 离开房间
   ========================================================== */
.bottom-hint {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid rgba(200, 200, 200, 0.04);
  font-size: 12px;
  letter-spacing: 0.14em;
  color: #4A4A4A;
  text-align: center;
  transition: color 1.2s ease;
}
.bottom-hint.bright { color: #7A7A7A; }

/* 离开房间（极淡） */
.leave-row {
  margin-top: 26px;
  text-align: center;
}
.leave-link {
  display: inline-block;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 12.5px;
  letter-spacing: 0.2em;
  color: #3A3A3A;
  cursor: pointer;
  padding: 4px 12px;
  transition: color 0.3s ease;
  user-select: none;
  -webkit-user-select: none;
}
.leave-link:hover { color: #8A8A8A; }
</style>
</head>

<body>

<div id="boot"></div>
<div class="noise"></div>
<div class="flash" id="flash"></div>

<div class="wrap" id="wrap">
  <div class="scene">

    <h1 class="scene-title">平安里3号楼 601</h1>

    <div class="narrative">
      <p class="nar-text" id="narText">你站在门内。

房间很暗。窗户被报纸糊住了。
空气里有灰尘的味道。

你身后是门。
门上有猫眼。</p>
    </div>

    <div class="hotspot-area">
      <p class="hs-label">房间里有：</p>
      <div class="hs-row" id="hsRow">
        <span class="hotspot" data-key="catEye">[猫眼]</span>
        <span class="hotspot" data-key="bed">[床]</span>
        <span class="hotspot" data-key="window">[窗户]</span>
        <span class="hotspot" data-key="wall">[墙]</span>
        <span class="hotspot" data-key="desk">[桌子]</span>
      </div>
    </div>

    <div class="floor-zone">
      <span class="floor-hotspot" id="floorHotspot">地板</span>
    </div>

    <div class="bottom-hint" id="bottomHint">房间很安静。</div>

    <div class="leave-row">
      <span class="leave-link" id="leaveRoom">离开房间</span>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     热区数据
     ============================================================ */
  var HOTSPOTS = {
    catEye: [
      '你透过猫眼往外看。\n\n走廊是暖黄色的。\n声控灯亮着。\n\n什么都没有。',
      '你又看了一次。\n\n走廊还是空的。\n\n但你看了很久。\n你发现自己一直没有眨眼。',
      '第三次。\n\n猫眼边缘那一圈，是暗的。\n\n有人站在外面。\n贴着门。\n\n你看不见它。\n它看得见你。',
      '别看了。',
      '你看见你自己站在门外。'
    ],

    bed: [
      '床很整齐。\n\n但床尾有一块凹陷。\n像是有人长期坐在那里。\n凹陷的大小，和你差不多。',
      '你伸手按了按那块凹陷。\n\n是温的。',
      '你突然意识到，\n你刚才坐过的地方，\n也留下了同样的凹陷。'
    ],

    window: [
      '窗户被报纸糊住了。\n\n报纸日期是 2013年6月3日。\n\n头版是一条寻人启事。\n寻人启事上的人，你认识。',
      '寻人启事上写着：\n\n“林小雨，女，24岁，\n于2013年6月2日失联。”\n\n照片里的她，\n站在楼道里，\n背对着一扇门。',
      '你想起那张照片。\n\n照片里的门上有猫眼。\n\n猫眼里是黑的。\n\n但你现在知道了，\n那不是黑的。\n\n那是有人从里面往外看，\n挡住了光。'
    ],

    wall: [
      '墙上有一行刻字。\n\n“你看了我三次。”\n\n字迹很浅，像是用指甲刻的。',
      '刻字下面还有一行更浅的字。\n\n“第一次是我看你，\n第二次是你看我，\n第三次是我们一起看。”',
      '你数了数。\n\n从猫眼看，第一次。\n看头像，第二次。\n刚才在猫眼那里，第三次。\n\n你看了三次。'
    ],

    desk: [
      '桌子上有一本日记。\n\n封面很旧，边角卷起。\n\n日记上有一把锁。\n锁是四位数字。'
    ]
  };

  var progress = {
    catEye: 0,
    bed:    0,
    window: 0,
    wall:   0,
    desk:   0,
    floor:  0
  };

  var FLOOR_TEXTS = [
    '地板上有划痕。',
    '划痕是字：“第七扇门在下面”',
    '你低头看地板，\n发现地板是透明的。\n\n下面还有一层。\n601下面还有601。'
  ];

  /* ============================================================
     元素
     ============================================================ */
  var narText   = document.getElementById('narText');
  var hsRow     = document.getElementById('hsRow');
  var hint      = document.getElementById('bottomHint');
  var flash     = document.getElementById('flash');
  var floorHot  = document.getElementById('floorHotspot');
  var leaveRoom = document.getElementById('leaveRoom');

  var transitioning = false;
  var lockOpen = false;
  var lockSolved = false;

  /* ============================================================
     通用：显示一段叙述
     ============================================================ */
  function showText(text, opts) {
    opts = opts || {};
    if (transitioning) return;
    transitioning = true;

    narText.classList.remove('final');
    narText.classList.remove('warn');
    narText.classList.add('fade');

    setTimeout(function () {
      narText.textContent = text;

      if (opts.final) narText.classList.add('final');
      if (opts.warn)  narText.classList.add('warn');

      narText.classList.remove('fade');

      setTimeout(function () {
        transitioning = false;
      }, 460);
    }, 450);
  }

  /* ============================================================
     闪烁
     ============================================================ */
  function triggerFlash() {
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');
    setTimeout(function () {
      flash.classList.remove('on');
    }, 620);
  }

  /* ============================================================
     密码锁面板
     ============================================================ */
  var LOCK_PASSWORD = '6013';

  function openLockPanel() {
    if (lockOpen || lockSolved) return;
    lockOpen = true;

    var old = document.getElementById('lockPanelBlock');
    if (old) old.parentNode.removeChild(old);

    var panel = document.createElement('div');
    panel.id = 'lockPanelBlock';
    panel.className = 'lock-panel';
    panel.innerHTML =
      '<p class="lp-title">请输入四位密码：</p>' +
      '<div class="lock-row">' +
        '<input type="text" class="lock-input" id="lockInput" ' +
               'inputmode="numeric" maxlength="4" autocomplete="off" ' +
               'aria-label="四位密码">' +
        '<button class="lock-btn" id="lockBtn" type="button">开锁</button>' +
      '</div>' +
      '<p class="lock-hint">提示：' +
        '<span class="em">密码 = 她的门牌号 + 她看它的次数</span><br>' +
        '（格式：数字+数字，例如 1234）' +
      '</p>' +
      '<p class="lock-error" id="lockError"></p>';

    var narrative = document.querySelector('.narrative');
    narrative.parentNode.insertBefore(panel, narrative.nextSibling);

    var input = document.getElementById('lockInput');
    var btn   = document.getElementById('lockBtn');
    var err   = document.getElementById('lockError');

    input.addEventListener('input', function () {
      err.classList.remove('on');
    });

    function tryUnlock() {
      var val = input.value.trim();

      if (val === LOCK_PASSWORD) {
        lockSolved = true;
        err.classList.remove('on');

        showText('锁开了。\n\n日记的封面慢慢翻开……', { final: true });

        panel.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
        panel.style.opacity = '0';
        panel.style.transform = 'translateY(-6px)';

        setTimeout(function () {
          if (panel.parentNode) panel.parentNode.removeChild(panel);
        }, 760);

        setTimeout(function () {
          var wrap = document.getElementById('wrap');
          wrap.style.transition = 'opacity 1s ease';
          wrap.style.opacity = '0';

          setTimeout(function () {
            window.location.href = '601/diary.html';
          }, 1050);
        }, 1600);

      } else {
        err.textContent = '锁没有反应。\n她还在等。';
        err.classList.add('on');
        input.select();
      }
    }

    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        tryUnlock();
      }
    });

    setTimeout(function () {
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      input.focus();
    }, 120);
  }

  /* ============================================================
     热区点击
     ============================================================ */
  function onHotspotClick(key) {
    /* 桌子：特殊处理 */
    if (key === 'desk') {
      if (lockSolved) return;

      if (progress.desk === 0) {
        progress.desk = 1;
        showText(HOTSPOTS.desk[0]);
        var el0 = hsRow.querySelector('[data-key="desk"]');
        if (el0) el0.classList.add('seen');
        return;
      }

      if (!lockOpen) {
        showText('你拿起日记。\n\n锁上是四个数字的转轮。\n\n需要密码。');
        setTimeout(openLockPanel, 620);
      }
      return;
    }

    var list = HOTSPOTS[key];
    if (!list) return;

    /* ========================================================
       猫眼：记录点击次数（用于结局判定）
       ======================================================== */
    if (key === 'catEye') {
      var n = parseInt(sessionStorage.getItem('catEye') || '0', 10) + 1;
      sessionStorage.setItem('catEye', String(n));
    }

    var idx = progress[key];
    var maxIdx = list.length - 1;

    if (idx < maxIdx) {
      progress[key] = idx + 1;
    } else {
      idx = maxIdx;
    }

    var text = list[idx];

    var isFinal = false;
    if (key === 'catEye') {
      if (idx === 4) {
        triggerFlash();
        isFinal = true;
        hint.textContent = '你没有眨眼。';
        hint.classList.add('bright');
      } else if (idx === 3) {
        hint.textContent = '走廊里很安静。';
        hint.classList.add('bright');
      }
    }

    showText(text, { final: isFinal });

    var el = hsRow.querySelector('[data-key="' + key + '"]');
    if (el) el.classList.add('seen');
  }

  hsRow.addEventListener('click', function (e) {
    var hs = e.target.closest ? e.target.closest('.hotspot') : null;
    if (!hs) return;
    var key = hs.getAttribute('data-key');
    if (key) onHotspotClick(key);
  });

  hsRow.addEventListener('touchend', function (e) {
    var hs = e.target.closest ? e.target.closest('.hotspot') : null;
    if (!hs) return;
    e.preventDefault();
    var key = hs.getAttribute('data-key');
    if (key) onHotspotClick(key);
  }, { passive: false });

  /* ============================================================
     地板
     ============================================================ */
  floorHot.addEventListener('click', function () {
    if (progress.floor >= FLOOR_TEXTS.length) return;
    var idx = progress.floor;
    progress.floor++;
    showText(FLOOR_TEXTS[idx], { final: idx === 2 });
    if (idx === 2) {
      hint.textContent = '下面还有一层。';
      hint.classList.add('bright');
    }
  });

  floorHot.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (progress.floor >= FLOOR_TEXTS.length) return;
    var idx = progress.floor;
    progress.floor++;
    showText(FLOOR_TEXTS[idx], { final: idx === 2 });
    if (idx === 2) {
      hint.textContent = '下面还有一层。';
      hint.classList.add('bright');
    }
  }, { passive: false });

  /* ============================================================
     离开房间（记录结局 B）
     ============================================================ */
  leaveRoom.addEventListener('click', function () {
    sessionStorage.setItem('left601', '1');
    var wrap = document.getElementById('wrap');
    wrap.style.transition = 'opacity 1.2s ease';
    wrap.style.opacity = '0';
    setTimeout(function () {
      window.location.href = '../index.html';
    }, 1250);
  });

  /* ============================================================
     假加载
     ============================================================ */
  setTimeout(function () {
    document.getElementById('wrap').classList.add('loaded');
    document.getElementById('boot').classList.add('gone');
  }, 900);

})();
</script>

</body>
</html>
