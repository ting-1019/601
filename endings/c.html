<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线</title>
<style>
/* ==========================================================
   全局
   ========================================================== */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: #0A0A0A;
  font-family: "Courier New", "Consolas", "Songti SC", "SimSun", monospace;
  font-size: 16px;
  line-height: 2.05;
  color: #E0E0E0;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
}

::selection { background: #E0E0E0; color: #0A0A0A; }
::-moz-selection { background: #E0E0E0; color: #0A0A0A; }

/* ==========================================================
   假加载
   ========================================================== */
#boot {
  position: fixed; inset: 0;
  background: #0A0A0A;
  z-index: 9999;
  transition: opacity 0.9s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

/* ==========================================================
   噪点
   ========================================================== */
.noise {
  position: fixed;
  inset: 0;
  z-index: 9000;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  mix-blend-mode: screen;
}

/* ==========================================================
   主容器
   ========================================================== */
.wrap {
  width: 100%;
  max-width: 440px;
  text-align: center;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.wrap.loaded { opacity: 1; }

/* ==========================================================
   阶段
   ========================================================== */
.stage {
  display: none;
}
.stage.on { display: block; }

/* 文本行 */
.stage-line {
  font-family: "Courier New", "Consolas", "Songti SC", "SimSun", monospace;
  font-size: 16px;
  line-height: 2.1;
  letter-spacing: 0.06em;
  color: #C8C8C8;
  white-space: pre-line;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity 1.3s ease, transform 1.3s ease;
}
.stage-line.on {
  opacity: 1;
  transform: translateY(0);
}

/* 阶段1 */
.stage1 .stage-line {
  color: #C8C8C8;
}

/* 阶段2：更沉，字距更开 */
.stage2 .stage-line {
  color: #E8E8E8;
  font-size: 17px;
  letter-spacing: 0.14em;
}
.stage2 .stage-line.gap {
  height: 1.4em;
  margin: 0;
  padding: 0;
}

/* 光标 */
.cursor {
  display: inline-block;
  width: 9px;
  height: 15px;
  background: #E0E0E0;
  margin-left: 4px;
  vertical-align: -2px;
  animation: blink 1s infinite steps(1);
}
@keyframes blink {
  0%, 50%   { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* ==========================================================
   返回按钮（阶段3 结束时出现）
   ========================================================== */
.back-row {
  opacity: 0;
  transition: opacity 1.6s ease;
}
.back-row.on { opacity: 1; }

.back-link {
  display: inline-block;
  padding: 10px 32px;
  font-family: "Courier New", "Consolas", "Songti SC", "SimSun", monospace;
  font-size: 14px;
  letter-spacing: 0.28em;
  color: #C8C8C8;
  border: 1px solid rgba(200, 200, 200, 0.3);
  background: transparent;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease,
              border-color 0.3s ease;
  user-select: none;
  -webkit-user-select: none;
}
.back-link:hover {
  background: #E0E0E0;
  color: #0A0A0A;
  border-color: #E0E0E0;
}
.back-link:active {
  background: #FFFFFF;
}

/* ==========================================================
   移动端
   ========================================================== */
@media (max-width: 480px) {
  body { font-size: 15px; padding: 50px 22px; }
  .stage-line { font-size: 15px; }
  .stage2 .stage-line { font-size: 16px; letter-spacing: 0.12em; }
  .back-link { font-size: 13px; padding: 9px 26px; }
}
</style>
</head>

<body>

<div id="boot"></div>
<div class="noise"></div>

<div class="wrap" id="wrap">

  <!-- ============ 阶段 1 ============ -->
  <div class="stage stage1" id="stage1">
    <div class="stage-line" data-delay="0">当前在线：2 人</div>
    <div class="stage-line" data-delay="700">小雨转晴</div>
    <div class="stage-line" data-delay="1400">您<span class="cursor"></span></div>
  </div>

  <!-- ============ 阶段 2 ============ -->
  <div class="stage stage2" id="stage2">
    <div class="stage-line" data-delay="0">您已看过她 3 次。</div>
    <div class="stage-line gap" data-delay="0"></div>
    <div class="stage-line" data-delay="1800">现在，您也是它了。</div>
  </div>

  <!-- ============ 阶段 3 ============ -->
  <div class="stage stage3" id="stage3">
    <div class="back-row" id="backRow">
      <span class="back-link" id="backLink">返回首页</span>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     时间轴
     ============================================================ */
  var T_BOOT       = 800;      /* 假加载时长 */
  var T_STAGE1     = 700;      /* 假加载后，阶段1 开始 */
  var T_STAGE1_DUR = 5000;     /* 阶段1 显示 5 秒 */
  var T_STAGE2_DUR = 5000;     /* 阶段2 显示 5 秒 */
  var T_BLACK      = 10000;    /* 阶段3：全黑 10 秒 */

  /* ============================================================
     元素
     ============================================================ */
  var wrap     = document.getElementById('wrap');
  var stage1   = document.getElementById('stage1');
  var stage2   = document.getElementById('stage2');
  var stage3   = document.getElementById('stage3');
  var backRow  = document.getElementById('backRow');
  var backLink = document.getElementById('backLink');

  /* ============================================================
     显示某个阶段的文本行（带延迟）
     ============================================================ */
  function playStage(stage, onDone) {
    stage.classList.add('on');

    var lines = stage.querySelectorAll('.stage-line');
    var maxDelay = 0;

    Array.prototype.forEach.call(lines, function (line) {
      var d = parseInt(line.getAttribute('data-delay') || '0', 10);
      if (d > maxDelay) maxDelay = d;

      setTimeout(function () {
        line.classList.add('on');
      }, d);
    });

    if (typeof onDone === 'function') {
      setTimeout(onDone, maxDelay + 900);
    }
  }

  /* ============================================================
     收起某个阶段（淡出后移除）
     ============================================================ */
  function hideStage(stage) {
    var lines = stage.querySelectorAll('.stage-line');
    Array.prototype.forEach.call(lines, function (line) {
      line.classList.remove('on');
      line.style.opacity = '0';
    });

    setTimeout(function () {
      stage.classList.remove('on');
    }, 1300);
  }

  /* ============================================================
     主流程
     ============================================================ */
  function runSequence() {

    /* ---------- 阶段 1 ---------- */
    playStage(stage1);

    /* 5 秒后进入阶段 2 */
    setTimeout(function () {

      hideStage(stage1);

      setTimeout(function () {

        /* ---------- 阶段 2 ---------- */
        playStage(stage2);

        /* 5 秒后进入阶段 3 */
        setTimeout(function () {

          hideStage(stage2);

          setTimeout(function () {

            /* ---------- 阶段 3：全黑 10 秒 ---------- */
            stage3.classList.add('on');

            setTimeout(function () {
              /* 全黑结束，出现返回按钮 */
              backRow.classList.add('on');
            }, T_BLACK);

          }, 1300);

        }, T_STAGE2_DUR);

      }, 500);

    }, T_STAGE1_DUR);
  }

  /* ============================================================
     返回首页
     ============================================================ */
  backLink.addEventListener('click', function () {
    /* 设置标记，让 P10 论坛首页显示“当前在线：3 人” */
    try {
      sessionStorage.setItem('endingC', '1');
    } catch (err) { /* 隐私模式等，忽略 */ }

    /* 整页淡出 */
    document.body.style.transition = 'opacity 1.3s ease';
    document.body.style.opacity = '0';

    setTimeout(function () {
      window.location.href = '../bbs/index.html';
    }, 1350);
  });

  /* ============================================================
     启动
     ============================================================ */
  setTimeout(function () {
    wrap.classList.add('loaded');
    document.getElementById('boot').classList.add('gone');

    setTimeout(runSequence, T_STAGE1);
  }, T_BOOT);

})();
</script>

</body>
</html>
