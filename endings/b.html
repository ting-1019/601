<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离开</title>
<style>
/* ==========================================================
   全局
   ========================================================== */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: #FFFFFF;
  font-family: "Songti SC", "SimSun", "STSong", "Songti TC",
               "Noto Serif SC", "Source Han Serif SC", serif;
  font-size: 17px;
  line-height: 2.1;
  color: #2B2B2B;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
}

::selection { background: #2B2B2B; color: #FFFFFF; }
::-moz-selection { background: #2B2B2B; color: #FFFFFF; }

a { color: inherit; text-decoration: none; }

/* ==========================================================
   假加载
   ========================================================== */
#boot {
  position: fixed; inset: 0;
  background: #FFFFFF;
  z-index: 9999;
  transition: opacity 0.9s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

/* ==========================================================
   内容
   ========================================================== */
.wrap {
  width: 100%;
  max-width: 500px;
  opacity: 0;
  transition: opacity 1.4s ease;
}
.wrap.loaded { opacity: 1; }

.ending {
  text-align: left;
}

.line {
  margin: 0 0 2.2em;
  font-size: 17px;
  line-height: 2.15;
  letter-spacing: 0.06em;
  color: #2B2B2B;
  white-space: pre-line;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 1.5s ease, transform 1.5s ease;
}
.line.on {
  opacity: 1;
  transform: translateY(0);
}

/* 空行 */
.line.short {
  margin-bottom: 1.6em;
}

/* 门后的那行字：稍沉一点 */
.line.final {
  color: #1A1A1A;
  font-size: 18px;
  letter-spacing: 0.1em;
}

/* ==========================================================
   底部按钮
   ========================================================== */
.back-row {
  margin-top: 64px;
  opacity: 0;
  transition: opacity 1.8s ease;
}
.back-row.on { opacity: 1; }

.back-link {
  display: inline-block;
  padding: 10px 34px;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  color: #2B2B2B;
  border: 1px solid #D8D8D8;
  background: #FFFFFF;
  cursor: pointer;
  transition: background 0.25s ease, border-color 0.25s ease,
              color 0.25s ease;
}
.back-link:hover {
  background: #2B2B2B;
  color: #FFFFFF;
  border-color: #2B2B2B;
}
.back-link:active {
  background: #1A1A1A;
}

/* ==========================================================
   极淡的噪点
   ========================================================== */
.noise {
  position: fixed;
  inset: 0;
  z-index: 9000;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ==========================================================
   移动端
   ========================================================== */
@media (max-width: 560px) {
  body {
    font-size: 16px;
    padding: 60px 26px;
    align-items: flex-start;
  }
  .wrap { max-width: 100%; }
  .line { font-size: 16px; margin-bottom: 2em; }
  .line.final { font-size: 17px; }
  .back-row { margin-top: 52px; }
}
</style>
</head>

<body>

<div id="boot"></div>
<div class="noise"></div>

<div class="wrap" id="wrap">
  <div class="ending" id="ending">

    <p class="line" data-delay="600">你决定不再看了。</p>

    <p class="line short" data-delay="0"></p>

    <p class="line" data-delay="0">你关掉网页，合上电脑。</p>

    <p class="line short" data-delay="0"></p>

    <p class="line" data-delay="0">那天晚上，你听到楼道里有脚步声。</p>
    <p class="line" data-delay="0">一层一层往上走。</p>
    <p class="line" data-delay="0">走到你家门口，停了一下。</p>

    <p class="line short" data-delay="0"></p>

    <p class="line" data-delay="0">你没有去看猫眼。</p>

    <p class="line short" data-delay="0"></p>

    <p class="line" data-delay="0">脚步声继续往上走了。</p>

    <p class="line short" data-delay="0"></p>

    <p class="line" data-delay="0">第二天，你发现门后面有一行字：</p>

    <p class="line short" data-delay="0"></p>

    <p class="line final" data-delay="0">“谢谢你没有看。”</p>

  </div>

  <div class="back-row" id="backRow">
    <span class="back-link" id="backLink">返回首页</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var INTERVAL = 2000;      /* 每行间隔 2 秒 */
  var BOOT_TIME = 800;      /* 假加载时长 */

  var wrap    = document.getElementById('wrap');
  var backRow = document.getElementById('backRow');
  var lines   = document.querySelectorAll('.line');

  /* ============================================================
     顺序显示每一行
     ============================================================ */
  function startSequence() {
    var t = 0;

    lines.forEach(function (line) {
      /* 空行不占额外等待 */
      if (line.textContent.trim() === '') {
        setTimeout(function () {
          line.classList.add('on');
        }, t);
        return;
      }

      t += INTERVAL;
      setTimeout(function () {
        line.classList.add('on');
      }, t);
    });

    /* 最后一行出现后，稍等再显示按钮 */
    setTimeout(function () {
      backRow.classList.add('on');
    }, t + 1800);
  }

  /* ============================================================
     返回首页
     ============================================================ */
  document.getElementById('backLink').addEventListener('click', function () {
    document.body.style.transition = 'opacity 1.2s ease';
    document.body.style.opacity = '0';

    setTimeout(function () {
      window.location.href = '../bbs/index.html';
    }, 1250);
  });

  /* ============================================================
     假加载 → 启动序列
     ============================================================ */
  setTimeout(function () {
    wrap.classList.add('loaded');
    document.getElementById('boot').classList.add('gone');

    setTimeout(startSequence, 900);
  }, BOOT_TIME);

})();
</script>

</body>
</html>
