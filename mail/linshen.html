<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>林深的收件箱</title>
<style>
/* ========== 基础 ========== */
* { box-sizing: border-box; }

html, body {
  background: #F5F3EE;
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: "Songti SC", "SimSun", "STSong", "Songti TC",
               "Noto Serif SC", "Source Han Serif SC", serif;
  color: #2B2B2B;
  font-size: 15px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ========== 假加载 ========== */
#boot {
  position: fixed;
  inset: 0;
  background: #FFFFFF;
  z-index: 9999;
  transition: opacity 0.55s ease;
}
#boot.gone {
  opacity: 0;
  pointer-events: none;
}

.wrap {
  opacity: 0;
  transition: opacity 0.9s ease;
}
.wrap.loaded { opacity: 1; }

/* ========== 噪点 ========== */
.noise {
  position: fixed;
  inset: 0;
  z-index: 9000;
  pointer-events: none;
  opacity: 0.03;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ========== 链接 ========== */
a {
  color: #3A5A8C;
  text-decoration: none;
  cursor: pointer;
}
a:hover {
  text-decoration: underline;
  text-decoration-color: rgba(58, 90, 140, 0.32);
  text-underline-offset: 3px;
}

/* ================================================================
   第一阶段 · 锁屏
   ================================================================ */
#lockScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.85s ease;
}
#lockScreen.gone {
  opacity: 0;
  pointer-events: none;
}

.lock-inner {
  width: 420px;
  text-align: center;
  padding: 40px 0 80px;
}

.lock-title {
  font-family: "Songti SC", "SimSun", serif;
  font-size: 20px;
  letter-spacing: 0.12em;
  color: #2B2B2B;
  margin: 0 0 10px;
  font-weight: normal;
}

.lock-sub {
  font-size: 13px;
  letter-spacing: 0.28em;
  color: #9A9A9A;
  margin: 0 0 42px;
}

.lock-form {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 22px;
}

#pwInput {
  width: 190px;
  padding: 8px 12px;
  font-family: "Courier New", monospace;
  font-size: 15px;
  letter-spacing: 0.28em;
  color: #2B2B2B;
  background: #FBF9F4;
  border: 1px solid #D6D0C4;
  outline: none;
  transition: border-color 0.2s ease;
}
#pwInput:focus {
  border-color: #B8B0A0;
}

#pwBtn {
  padding: 8px 22px;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 13px;
  letter-spacing: 0.16em;
  color: #4A4A4A;
  background: #EDEAE3;
  border: 1px solid #D6D0C4;
  cursor: pointer;
  transition: background 0.18s ease;
}
#pwBtn:hover { background: #E4E0D6; }
#pwBtn:active { background: #DAD5C9; }

.lock-hint {
  font-size: 12.5px;
  color: #9A9A9A;
  letter-spacing: 0.03em;
  margin: 0;
}

.lock-error {
  font-size: 12.5px;
  color: #9A9A9A;
  letter-spacing: 0.03em;
  margin: 16px 0 0;
  min-height: 20px;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.lock-error.on { opacity: 1; }

/* ================================================================
   第二阶段 · 收件箱
   ================================================================ */
#inbox {
  display: none;
  opacity: 0;
  transition: opacity 1s ease;
}
#inbox.on {
  display: block;
}
#inbox.visible {
  opacity: 1;
}

.page {
  width: 1024px;
  margin: 0 auto;
  padding: 40px 60px 70px;
}

/* 顶部标题条 */
.mail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 12px 18px;
  background: #EDEAE3;
  border-top: 1px solid #E2DED5;
  border-bottom: 1px solid #E2DED5;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 13px;
  letter-spacing: 0.02em;
  margin-bottom: 30px;
}
.mail-head .who { color: #2B2B2B; }
.mail-head .who .k { color: #9A9A9A; }
.mail-head .stat { color: #9A9A9A; }

/* 两栏 */
.mail-layout {
  display: flex;
  gap: 32px;
  align-items: flex-start;
}

/* ---- 左侧列表 ---- */
.mail-list {
  width: 268px;
  flex: 0 0 268px;
  border: 1px solid #E2DED5;
  background: #FBF9F4;
  overflow: hidden;
}

.mail-item {
  padding: 13px 16px 12px;
  border-bottom: 1px solid #EDEAE3;
  cursor: pointer;
  transition: background 0.18s ease;
}
.mail-item:last-child { border-bottom: 0; }
.mail-item:hover { background: #EDEAE3; }
.mail-item.active {
  background: #E9E5DB;
  box-shadow: inset 3px 0 0 #3A5A8C;
}

.mail-item .row1 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 3px;
}
.mail-item .from {
  font-size: 13.5px;
  color: #2B2B2B;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mail-item .date {
  font-family: "Courier New", monospace;
  font-size: 11.5px;
  color: #9A9A9A;
  flex: 0 0 auto;
}
.mail-item .subject {
  font-size: 12.5px;
  color: #9A9A9A;
  letter-spacing: 0.02em;
}

.mail-item .from.empty {
  color: #C9C2B6;
  font-style: italic;
}

/* ---- 右侧详情 ---- */
.mail-detail {
  flex: 1 1 auto;
  min-width: 0;
  border: 1px solid #E2DED5;
  background: #FBF9F4;
  padding: 32px 36px 44px;
  min-height: 460px;
}

.detail-meta {
  border-bottom: 1px dashed #C9C2B6;
  padding-bottom: 18px;
  margin-bottom: 26px;
}
.detail-meta .line {
  display: flex;
  gap: 14px;
  font-size: 13.5px;
  line-height: 2;
}
.detail-meta .k {
  color: #9A9A9A;
  flex: 0 0 62px;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 12.5px;
}
.detail-meta .v { color: #2B2B2B; }
.detail-meta .v.empty {
  color: #C9C2B6;
  font-style: italic;
}

.detail-body {
  white-space: pre-line;
  font-size: 15px;
  line-height: 2.1;
  letter-spacing: 0.02em;
  color: #2B2B2B;
  max-width: 620px;
}

/* 淡入切换 */
.detail-inner {
  opacity: 1;
  transition: opacity 0.32s ease;
}
.detail-inner.fading { opacity: 0; }

/* 底部快照入口 */
.snapshot-link {
  margin-top: 44px;
  padding-top: 22px;
  border-top: 1px dashed #C9C2B6;
  font-size: 14px;
  letter-spacing: 0.02em;
}
.snapshot-link .url {
  font-family: "Courier New", monospace;
  font-size: 13.5px;
}

/* 图片占位（通用，本页未用） */
.img-slot {
  background: #EDEAE3;
  border: 1px dashed #C9C2B6;
  color: #9A9A9A;
  font-size: 12px;
  text-align: center;
  padding: 30px 10px;
}
</style>
</head>

<body>

<div id="boot"></div>
<div class="noise"></div>

<div class="wrap" id="wrap">

  <!-- ============ 第一阶段：锁屏 ============ -->
  <div id="lockScreen">
    <div class="lock-inner">
      <h1 class="lock-title">林深的收件箱</h1>
      <p class="lock-sub">需要密码</p>

      <form class="lock-form" id="pwForm" autocomplete="off">
        <input id="pwInput" type="password" inputmode="numeric"
               maxlength="12" aria-label="密码">
        <button id="pwBtn" type="submit">登录</button>
      </form>

      <p class="lock-hint">提示：她的门牌号 </p>
      <p class="lock-error" id="pwError"></p>
    </div>
  </div>

  <!-- ============ 第二阶段：收件箱 ============ -->
  <div id="inbox">
    <div class="page">

      <div class="mail-head">
        <span class="who"><span class="k">收件箱：</span>林深　linshen.2013@mail.****</span>
        <span class="stat">共 3 封</span>
      </div>

      <div class="mail-layout">

        <!-- 左侧列表 -->
        <aside class="mail-list" id="mailList"></aside>

        <!-- 右侧详情 -->
        <section class="mail-detail">
          <div class="detail-inner" id="detailInner">
            <div class="detail-meta" id="detailMeta"></div>
            <div class="detail-body" id="detailBody"></div>
          </div>
        </section>

      </div>

      <!-- 底部固定链接 -->
      <div class="snapshot-link">
        论坛快照入口：
        <a class="url" href="../bbs/index.html">bbs.pinganli-old.cn/snapshot/forever</a>
      </div>

    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     数据
     ============================================================ */
  var PASSWORD = '601';

  var MAILS = [
    {
      from: '小雨转晴',
      time: '2013-05-20 22:31',
      subject: '（无）',
      body: '哥，我最近有点害怕。\n' +
            '我住的那个房子，晚上有脚步声。\n' +
            '我在猫眼里看了，没有人。\n' +
            '但我总觉得，有什么东西进来了。\n\n' +
            '你能不能回来一趟？'
    },
    {
      from: '小雨转晴',
      time: '2013-06-02 23:47',
      subject: '（无）',
      body: '哥，我今天数了门。\n' +
            '我家里不止一扇门。\n' +
            '我数到第七扇的时候，发现我在自己家门口。\n\n' +
            '我不知道我是从哪一天开始看的。'
    },
    {
      from: '',                       // 发件人空
      time: '2013-11-07 23:47',
      subject: '（无）',
      body: '她还在看。\n' +
            '你也在看。'
    }
  ];

  /* ============================================================
     假加载
     ============================================================ */
  setTimeout(function () {
    document.getElementById('wrap').classList.add('loaded');
    document.getElementById('boot').classList.add('gone');
  }, 700);

  /* ============================================================
     第一阶段 · 锁屏
     ============================================================ */
  var lockScreen = document.getElementById('lockScreen');
  var inbox      = document.getElementById('inbox');
  var pwForm     = document.getElementById('pwForm');
  var pwInput    = document.getElementById('pwInput');
  var pwError    = document.getElementById('pwError');

  var unlocked = false;

  pwInput.addEventListener('input', function () {
    pwError.classList.remove('on');
    pwError.textContent = '';
  });

  pwForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (unlocked) return;

    var val = pwInput.value.trim();

    if (val === PASSWORD) {
      unlocked = true;
      pwError.classList.remove('on');

      // 锁屏淡出
      lockScreen.classList.add('gone');

      // 收件箱淡入
      inbox.classList.add('on');
      // 强制 reflow，让 display:block 与 opacity 过渡依次生效
      void inbox.offsetWidth;
      inbox.classList.add('visible');

      // 移除锁屏，避免占用 tab 焦点
      setTimeout(function () {
        lockScreen.style.display = 'none';
      }, 900);

    } else {
      pwError.textContent = '密码错误。再想想。';
      pwError.classList.add('on');
      pwInput.focus();
      pwInput.select();
    }
  });

  /* ============================================================
     第二阶段 · 收件箱
     ============================================================ */
  var mailList    = document.getElementById('mailList');
  var detailInner = document.getElementById('detailInner');
  var detailMeta  = document.getElementById('detailMeta');
  var detailBody  = document.getElementById('detailBody');

  var current = -1;

  /* ---- 渲染左侧列表 ---- */
  MAILS.forEach(function (m, i) {
    var item = document.createElement('div');
    item.className = 'mail-item';
    item.setAttribute('data-idx', String(i));

    var fromCls = m.from ? 'from' : 'from empty';
    var fromTxt = m.from ? m.from : '—';

    item.innerHTML =
      '<div class="row1">' +
        '<span class="' + fromCls + '">' + fromTxt + '</span>' +
        '<span class="date">' + m.time.slice(0, 10) + '</span>' +
      '</div>' +
      '<div class="subject">' + m.subject + '</div>';

    item.addEventListener('click', function () {
      showMail(i);
    });

    mailList.appendChild(item);
  });

  var listItems = Array.prototype.slice.call(
    mailList.querySelectorAll('.mail-item')
  );

  /* ---- 显示某封邮件 ---- */
  function renderDetail(i) {
    var m = MAILS[i];

    var fromHtml = m.from
      ? '<span class="v">' + escapeHtml(m.from) + '</span>'
      : '<span class="v empty">（空）</span>';

    detailMeta.innerHTML =
      '<div class="line"><span class="k">发件人</span>' + fromHtml + '</div>' +
      '<div class="line"><span class="k">时间</span><span class="v">' +
        escapeHtml(m.time) + '</span></div>' +
      '<div class="line"><span class="k">主题</span><span class="v">' +
        escapeHtml(m.subject) + '</span></div>';

    detailBody.textContent = m.body;
  }

  function showMail(i) {
    if (i === current) return;

    // 列表高亮
    listItems.forEach(function (el, idx) {
      el.classList.toggle('active', idx === i);
    });

    // 详情淡入淡出
    detailInner.classList.add('fading');

    setTimeout(function () {
      renderDetail(i);
      current = i;
      detailInner.classList.remove('fading');
    }, 180);
  }

  /* ---- 工具 ---- */
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---- 默认显示第一封 ---- */
  showMail(0);

  // 锁屏未解锁前，避免收件箱内的链接被 Tab 到
  inbox.setAttribute('aria-hidden', 'true');
  var unlockObserver = setInterval(function () {
    if (unlocked) {
      inbox.removeAttribute('aria-hidden');
      clearInterval(unlockObserver);
    }
  }, 200);

})();
</script>

</body>
</html>
