    },
    {

    {

      cat: '求助',

    {

      lastUser: '老周',

      state: 'normal',
      preview: '本来不想说的。但既然她已经好几天没上线了，我还是说两句。\n关于那个猫眼的说法，我年轻时候也听过。'
    },
    {
      id: 5,
      cat: '',
      title: '404',
      author: '匿名',
      authorUrl: null,
      postTime: '2013-11-06',
      reply: 0,
      views: 7,
      lastUser: '匿名',
      lastUrl: null,
      lastTime: '2013-11-06',
      url: 'talk/1106.html',
      state: 'none',
      preview: '（该主题内容无法显示。）'
    }
  ];

  /* ============================================================
     状态
     ============================================================ */
  var state = {
    cat: 'all',
    sort: 'default',
    sortAsc: true
  };

  /* ============================================================
     假加载
     ============================================================ */
  setTimeout(function () {
    document.getElementById('wrap').classList.add('loaded');
    document.getElementById('boot').classList.add('gone');
  }, 700);

  /* ============================================================
     模态框
     ============================================================ */
  var overlay = document.getElementById('modalOverlay');
  var mTitle  = document.getElementById('modalTitle');
  var mBody   = document.getElementById('modalBody');
  var mClose  = document.getElementById('modalClose');

  function openModal(title, html) {
    mTitle.textContent = title || '提示';
    mBody.innerHTML = html;
    overlay.classList.add('on');
  }
  function closeModal() { overlay.classList.remove('on'); }

  mClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  Array.prototype.forEach.call(
    document.querySelectorAll('[data-modal]'),
    function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        openModal(el.getAttribute('data-title') || '提示',
                  el.getAttribute('data-modal'));
      });
    }
  );

  /* ============================================================
     渲染帖子列表
     ============================================================ */
  var tbody   = document.getElementById('threadBody');
  var summary = document.getElementById('summary');

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function catTag(cat) {
    if (!cat) return '';
    var cls = 'other';
    if (cat === '怪谈') cls = 'talk';
    else if (cat === '求助') cls = 'help';
    else if (cat === '讨论') cls = 'disc';
    return '<span class="cat-tag ' + cls + '">' + escapeHtml(cat) + '</span>';
  }

  function iconClass(t) {
    if (t.reply === 0) return 'thread-icon none';
    if (t.reply >= 8)  return 'thread-icon';
    return 'thread-icon old';
  }

  function authorCell(name, url) {
    if (url) {
      return '<a class="who" href="' + url + '">' + escapeHtml(name) + '</a>';
    }
    return '<span class="who plain" data-anon="' + escapeHtml(name) + '">' +
           escapeHtml(name) + '</span>';
  }

  function buildRow(t) {
    var titleCls = 'thread-title';
    if (t.reply === 0) titleCls += ' read';

    var row =
      '<tr data-id="' + t.id + '">' +
        '<td class="col-icon"><div class="' + iconClass(t) + '"></div></td>' +
        '<td class="col-subject">' +
          catTag(t.cat) +
          '<a class="' + titleCls + '" href="' + t.url + '"' +
            ' data-preview="' + escapeHtml(t.preview) + '">' +
            escapeHtml(t.title) +
          '</a>' +
        '</td>' +
        '<td class="col-author">' +
          authorCell(t.author, t.authorUrl) +
          '<br><span class="when">' + t.postTime + '</span>' +
        '</td>' +
        '<td class="col-count">' +
          '<span class="r">' + t.reply + '</span>' +
          '<span class="sep">/</span>' +
          '<span class="v">' + t.views + '</span>' +
        '</td>' +
        '<td class="col-last">' +
          authorCell(t.lastUser, t.lastUrl) +
          '<br><span class="when">' + t.lastTime + '</span>' +
        '</td>' +
      '</tr>';

    return row;
  }

  function getVisible() {
    var list = THREADS.filter(function (t) {
      if (state.cat === 'all') return true;
      return t.cat === state.cat;
    });

    var sortKey = state.sort;
    if (sortKey === 'default') return list;

    var sorted = list.slice().sort(function (a, b) {
      var va, vb;
      if (sortKey === 'post') {
        va = a.postTime; vb = b.postTime;
        return state.sortAsc ? (va < vb ? -1 : va > vb ? 1 : 0)
                             : (va > vb ? -1 : va < vb ? 1 : 0);
      }
      if (sortKey === 'last') {
        va = a.lastTime; vb = b.lastTime;
        return state.sortAsc ? (va < vb ? -1 : va > vb ? 1 : 0)
                             : (va > vb ? -1 : va < vb ? 1 : 0);
      }
      if (sortKey === 'reply') {
        va = a.reply; vb = b.reply;
        return state.sortAsc ? va - vb : vb - va;
      }
      return 0;
    });

    return sorted;
  }

  function render() {
    var list = getVisible();

    if (list.length === 0) {
      tbody.innerHTML =
        '<tr><td class="no-threads" colspan="5">' +
        '本分类下没有主题。</td></tr>';
    } else {
      tbody.innerHTML = list.map(buildRow).join('');
    }

    summary.textContent = '共 ' + list.length + ' 条主题';

    bindRows();
  }

  function bindRows() {
    // 匿名作者弹窗
    Array.prototype.forEach.call(
      tbody.querySelectorAll('[data-anon]'),
      function (el) {
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          openModal('该用户', '该用户已注销。');
        });
      }
    );
  }

  /* ============================================================
     筛选 / 排序
     ============================================================ */
  var catOpts  = document.querySelectorAll('.filter-bar .opt[data-cat]');
  var sortOpts = document.querySelectorAll('.filter-bar .opt[data-sort]');

  Array.prototype.forEach.call(catOpts, function (opt) {
    opt.addEventListener('click', function (e) {
      e.preventDefault();
      Array.prototype.forEach.call(catOpts, function (o) {
        o.classList.remove('active');
      });
      opt.classList.add('active');
      state.cat = opt.getAttribute('data-cat');
      render();
    });
  });

  Array.prototype.forEach.call(sortOpts, function (opt) {
    opt.addEventListener('click', function (e) {
      e.preventDefault();
      var key = opt.getAttribute('data-sort');

      if (state.sort === key) {
        // 再次点击，切换升降序
        state.sortAsc = !state.sortAsc;
      } else {
        state.sort = key;
        // 最后发表 / 回复数 默认降序，发表时间默认升序
        state.sortAsc = (key === 'post');
      }

      Array.prototype.forEach.call(sortOpts, function (o) {
        o.classList.remove('active');
        // 清除旧箭头
        var ar = o.querySelector('.sort-arrow');
        if (ar) ar.parentNode.removeChild(ar);
      });
      opt.classList.add('active');

      var arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = state.sortAsc ? '▲' : '▼';
      opt.appendChild(arrow);

      render();
    });
  });

  /* ============================================================
     顶部按钮
     ============================================================ */
  document.getElementById('newThreadBtn').addEventListener('click', function (e) {
    e.preventDefault();
    openModal('提示', '该版块已归档，无法发表新主题。<br>' +
      '<span class="muted">本站将于 2013年11月10日 永久关闭。</span>');
  });

  document.getElementById('favBtn').addEventListener('click', function (e) {
    e.preventDefault();
    openModal('提示', '收藏成功。<br>' +
      '<span class="muted">该版块将于 2013年11月10日 永久关闭。</span>');
  });

  /* ============================================================
     帖子预览浮层
     ============================================================ */
  var previewEl = document.getElementById('preview');
  var previewOn = false;

  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest ? e.target.closest('.thread-title') : null;
    if (t && t.getAttribute('data-preview')) {
      previewEl.textContent = t.getAttribute('data-preview');
      previewEl.classList.add('on');
      previewOn = true;
    }
  });

  document.addEventListener('mouseout', function (e) {
    var t = e.target.closest ? e.target.closest('.thread-title') : null;
    if (t) {
      previewEl.classList.remove('on');
      previewOn = false;
    }
  });

  document.addEventListener('mousemove', function (e) {
    if (!previewOn) return;
    var x = e.clientX + 16;
    var y = e.clientY + 18;
    var w = previewEl.offsetWidth;
    var h = previewEl.offsetHeight;
    if (x + w > window.innerWidth - 10)  x = e.clientX - w - 12;
    if (y + h > window.innerHeight - 10) y = e.clientY - h - 12;
    previewEl.style.left = x + 'px';
    previewEl.style.top  = y + 'px';
  });

  /* ============================================================
     初始化
     ============================================================ */
  render();

})();
</script>

</body>
